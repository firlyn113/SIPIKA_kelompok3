<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unggah Formulir</title>
    <link rel="stylesheet" href="style.css">
    </style>
</head>
<body>
    <header>
        <h1>Sistem Informasi Perizinan Ketidakhadiran Mahasiswa</h1>
    </header>

    <main>
        <hr>
        <section>
        <nav>
            <a href="index.html">Beranda</a> | 
            <a href="unggah.html">Unggah Formulir</a> | 
            <a href="rekap.html">Dashboard Rekap</a>
        </nav>
        <hr>
        </section>

        <p>Halaman untuk pengunggahan formulir</p>
        <h2>Formulir Perizinan</h2>

        <form action="" enctype="multipart/form-data" method="post">
        <label for="nim">NIM :</label>
        <input type="number" name="nim" maxlength="9" required>

        <br>
        <br>
        <label for="nama">Nama :</label>
        <input type="text" name="nama" placeholder="Contoh : Rahul" required>

        <br> <br>

        <label for="alasan">Alasan Tidak Hadir : </label>   
        <select name="alasan" id="alasan">
            <option value="Sakit">Sakit</option>
            <option value="Izin">Izin</option>
            <option value="Dispensasi">Dispensasi</option>
        </select>

        <br> <br>

        <label for="hari">Jumlah Hari Tidak Hadir :</label>
        <select name="alasan" id="alasan">
            <option value="1 hari">1 Hari</option>
            <option value="2-3 hari"><=3 Hari</option>
            <option value=">3 hari">>3 Hari</option>
        </select>

        <br><br>
        <label for="tanggal">Tanggal :</label>
        <input type="date">
        <br><br>
        
        <label for="Dokumen">Dokumen Pendukung :</label>
        <br>
        <input type="file">
        <br><br>
        <button type="submit">
            Kirimkan
        </button>
        <button type="reset">Reset</button>
        </form>

        <footer style="text-align: center;">
        Proyek matkul Pweb <a href="https://github.com/firlyn113">@Firlyajhh</a>
        </footer>

    </main>
    
</body>
</html>
